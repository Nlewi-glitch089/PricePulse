<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · PricePulse</title>
  <script src="/js/theme-init.js"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page">
    <div class="card auth-card stack">
      <a href="/" class="brand">
        <img class="brand-mark" src="/favicon.svg" alt="" width="28" height="28">
        <span>PricePulse</span>
      </a>
      <div>
        <h1>Welcome back</h1>
        <p class="secondary small">New here? <a href="/register.html">Create an account</a></p>
      </div>
      <form id="login-form" class="stack" novalidate>
        <div id="form-alert"></div>
        <div class="field" data-field="email">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error" autofocus>
          <span class="error" id="email-error" hidden></span>
        </div>
        <div class="field" data-field="password">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
          <span class="error" id="password-error" hidden></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign in</button>
      </form>
      <div class="auth-alt">
        <p class="small secondary">Just looking? Try PricePulse with made-up sample products. Nothing to sign up for.</p>
        <button type="button" class="btn btn-block" data-start-demo data-alert="form-alert">Explore a demo</button>
      </div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
